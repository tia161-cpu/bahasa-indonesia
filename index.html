<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruang Bahasa</title>
  <!-- React & Libraries -->
  <script src="[https://unpkg.com/react@18/umd/react.production.min.js](https://unpkg.com/react@18/umd/react.production.min.js)" crossorigin></script>
  <script src="[https://unpkg.com/react-dom@18/umd/react-dom.production.min.js](https://unpkg.com/react-dom@18/umd/react-dom.production.min.js)" crossorigin></script>
  <script src="[https://unpkg.com/@babel/standalone/babel.min.js](https://unpkg.com/@babel/standalone/babel.min.js)"></script>
  <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>

<body class="bg-slate-50">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const INITIAL_MATERI = [
      {
        id: 'm1',
        kelas: 'X',
        judul: 'Teks Laporan Hasil Observasi (LHO)',
        bab: 'Bab 1: Mengungkap Fakta Alam',

        konten: `### A. Pengertian Teks LHO\nTeks Laporan Hasil Observasi adalah teks yang memberikan informasi secara umum tentang sesuatu berdasarkan fakta dari hasil pengamatan secara langsung.\n\n### B. Struktur Teks LHO\n1. Pernyataan Umum\n2. Deskripsi Bagian\n3. Deskripsi Manfaat`
      },
      {
        id: 'm2',
        kelas: 'XI',
        judul: 'Teks Prosedur Kompleks',
        bab: 'Bab 1: Menyusun Prosedur Kerja',
        deskripsi: 'Langkah-langkah terstruktur dalam melakukan atau membuat sesuatu dengan petunjuk jelas.',
        videoUrl: '[https://www.youtube.com/embed/dQw4w9WgXcQ](https://www.youtube.com/embed/dQw4w9WgXcQ)',
        konten: `### A. Pengertian\nTeks prosedur adalah teks yang berisi cara, tujuan untuk membuat atau melakukan sesuatu hal langkah demi langkah.`
      },
      {
        id: 'm3',
        kelas: 'XII',
        judul: 'Surat Lamaran Pekerjaan & Teks Editorial',
        bab: 'Bab 1: Surat Menyurat Resmi',
        deskripsi: 'Seni menulis surat resmi lamaran kerja dan menganalisis pandangan media massa.',
        videoUrl: '[https://www.youtube.com/embed/dQw4w9WgXcQ](https://www.youtube.com/embed/dQw4w9WgXcQ)',
        konten: `### A. Unsur-Unsur Surat Lamaran Kerja\n1. Tempat dan tanggal\n2. Lampiran\n3. Alamat surat\n4. Salam pembuka\n5. Isi\n6. Penutup`
      }
    ];

    function App() {
      const [selectedKelas, setSelectedKelas] = useState('X');
      const [activeTab, setActiveTab] = useState('materi');

      return (
        <div className="min-h-screen">
          <header className="bg-emerald-700 text-white p-4 shadow-md">
            <div className="max-w-4xl mx-auto flex justify-between items-center">
              <h1 className="text-xl font-bold">Ruang Bahasa</h1>
              <div className="flex gap-2">
                {['X', 'XI', 'XII'].map(k => (
                  <button 
                    key={k} 
                    onClick={() => setSelectedKelas(k)}
                    className={`px-3 py-1 rounded text-sm font-semibold ${selectedKelas === k ? 'bg-white text-emerald-800' : 'bg-emerald-600'}`}
                  >
                    Kelas {k}
                  </button>
                ))}
              </div>
            </div>
          </header>

          <main className="max-w-4xl mx-auto p-4">
            <div className="bg-white rounded-lg shadow p-6">
              <h2 className="text-2xl font-bold text-slate-800 mb-2">Materi Pembelajaran Kelas {selectedKelas}</h2>
              <p className="text-slate-600 mb-6">Pilih materi Bahasa Indonesia yang ingin dipelajari:</p>

              <div className="space-y-4">
                {INITIAL_MATERI.filter(m => m.kelas === selectedKelas).map(m => (
                  <div key={m.id} className="border border-slate-200 rounded-lg p-4 hover:border-emerald-500 transition-all">
                    <span className="text-xs font-semibold text-emerald-600 uppercase">{m.bab}</span>
                    <h3 className="text-lg font-bold text-slate-800">{m.judul}</h3>
                    <p className="text-sm text-slate-600 mt-1">{m.deskripsi}</p>
                    <div className="mt-3 bg-slate-50 p-3 rounded text-sm text-slate-700 whitespace-pre-line">
                      {m.konten}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App/>);
  </script>
</body>
</html>
